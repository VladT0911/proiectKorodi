<h2 mat-dialog-title>Create New Order</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 10px">
    <mat-label>Order Name</mat-label>
    <input matInput [(ngModel)]="order.name" placeholder="Enter order name" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 10px">
    <mat-label>Order Status</mat-label>
    <mat-select [(ngModel)]="order.status">
      <mat-option *ngFor="let status of statusOptions" [value]="status">
        {{ status }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 10px">
    <mat-label>Product Name</mat-label>
    <input matInput [(ngModel)]="order.product" placeholder="Enter product name" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 10px">
    <mat-label>Quantity</mat-label>
    <input matInput type="number" [(ngModel)]="order.quantity" min="1" />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()">Create</button>
</mat-dialog-actions>
