<h2 mat-dialog-title>Create New Order</h2>

<mat-dialog-content>
  @if (isLoading()) {
    <div style="display: flex; justify-content: center; padding: 20px;">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else {
    <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 10px">
      <mat-label>Order Name</mat-label>
      <input matInput [value]="order().name"
             (input)="updateField('name', $any($event.target).value)"
             placeholder="Enter order name" />
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 10px">
      <mat-label>Order Status</mat-label>
      <mat-select [value]="order().status"
                  (selectionChange)="updateField('status', $event.value)">
        @for (status of statusOptions; track status) {
          <mat-option [value]="status">{{ status }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 10px">
      <mat-label>Product Name</mat-label>
      <input matInput [value]="order().product"
             (input)="updateField('product', $any($event.target).value)"
             placeholder="Enter product name" />
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 10px">
      <mat-label>Quantity</mat-label>
      <input matInput type="number" [value]="order().quantity"
             (input)="updateField('quantity', +$any($event.target).value)"
             min="1" />
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 10px">
      <mat-label>Conveyor</mat-label>
      <mat-select [value]="order().conveyorId"
                  (selectionChange)="updateField('conveyorId', $event.value)">
        @for (conveyor of conveyors(); track conveyor.id) {
          <mat-option [value]="conveyor.id">
            {{ conveyor.name }} — {{ conveyor.status }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary"
          [disabled]="isLoading()"
          (click)="save()">
    Create
  </button>
</mat-dialog-actions>
