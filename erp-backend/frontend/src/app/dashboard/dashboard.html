<table>
  <thead>
  <tr>
    <th>id</th>
    <th>name</th>
    <th>status</th>
    <th>product</th>
    <th>quantity</th>
  </tr>
  </thead>

  <tbody>
  <tr *ngFor="let order of orders">
    <td>{{order.id}}</td>
    <td>{{order.name}}</td>
    <td>{{order.status}}</td>
    <td>{{order.product}}</td>
    <td>{{order.quantity}}</td>
  </tr>
  </tbody>
</table>
