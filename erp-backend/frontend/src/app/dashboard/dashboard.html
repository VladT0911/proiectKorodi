<div class="orders-header">
  <h2>PLC Orders</h2>
  <div>

    <button mat-stroked-button>Refresh</button>
    <button mat-raised-button color="primary" style="margin: 20px" (click)="openDialog()">
      Create new order
    </button>

  </div>
</div>
<mat-card class="filter-card">
  <div class="filters">
    <button mat-button color="primary">All</button>
    <button mat-button>Pending</button>
    <button mat-button>Processing</button>
    <button mat-button>Completed</button>
  </div>
</mat-card>

<mat-card class="table-card">
  <table mat-table [dataSource]="orders" class="full-width-table">

    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let order">{{order.id}}</td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let order">{{order.name}}</td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let order">
        <span [class]="'badge badge-' + order.status.toLowerCase()">
          {{order.status}}
        </span>
      </td>
    </ng-container>

    <!-- Product Column -->
    <ng-container matColumnDef="product">
      <th mat-header-cell *matHeaderCellDef>Product</th>
      <td mat-cell *matCellDef="let order">{{order.product}}</td>
    </ng-container>

    <!-- Quantity Column -->
    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef>Quantity</th>
      <td mat-cell *matCellDef="let order">{{order.quantity}}</td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let order">
        <button mat-raised-button color="primary" style="margin: 5px" (click)="editOrder(order)">Edit</button>
        <button mat-raised-button color="warn" style="margin: 5px" (click)="deleteOrder(order)">Delete</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
</mat-card>
